<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自用小工具</title>
<style>
:root{--bg:#f2f3f7;--paper:#fff;--ink:#1d2140;--muted:#666b88;--line:#dcdeea;--accent:#e2477a}
@media (prefers-color-scheme:dark){:root{--bg:#13152a;--paper:#1c1f38;--ink:#eceefa;--muted:#a2a6c4;--line:#2e3252;--accent:#ff6f9c}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;padding:32px 16px}
main{max-width:520px;margin:0 auto}
h1{font-size:22px;margin:0 0 16px}
a.tool{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:inherit;text-decoration:none;margin-bottom:10px}
a.tool img{width:44px;height:44px;border-radius:10px}
a.tool b{display:block}
a.tool span{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>自用小工具</h1>
<a class="tool" href="calendar/"><img src="calendar/icon-192.png" alt=""><div><b>行事曆便條</b><span>活動、購買紀錄、消息追蹤</span></div></a>
<a class="tool" href="trip/"><img src="trip/icon-192.png" alt=""><div><b>旅行行程</b><span>每日時間表、打勾、地圖導航</span></div></a>
<a class="tool" href="chiikawa/"><img src="chiikawa/icon-192.png" alt=""><div><b>吉伊卡哇地區限定</b><span>鐵牌收集、地圖、避免重複買</span></div></a>
</main>
</body>
</html>
